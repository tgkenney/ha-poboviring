when:
  event: tag

steps:
  - name: validate-version
    image: python:3.12-slim
    commands:
      - |
        TAG="${CI_COMMIT_TAG#v}"
        MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/pobovi_ring/manifest.json'))['version'])")
        if [ "$TAG" != "$MANIFEST_VERSION" ]; then
          echo "ERROR: Tag version ($TAG) does not match manifest.json version ($MANIFEST_VERSION)"
          echo "Update manifest.json 'version' to $TAG before tagging the release."
          exit 1
        fi
        echo "Version check passed: $TAG"

  - name: create-release
    image: alpine/curl:latest
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - apk add --no-cache jq
      - |
        TAG="${CI_COMMIT_TAG#v}"

        # Extract changelog section for this version
        NOTES=$(awk "/^## \[$TAG\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
        if [ -z "$NOTES" ]; then
          echo "WARNING: No changelog entry found for version $TAG"
          NOTES="See CHANGELOG.md for details."
        fi

        # Determine pre-release
        if echo "$CI_COMMIT_TAG" | grep -qE '(alpha|beta)'; then
          IS_PRERELEASE=true
        else
          IS_PRERELEASE=false
        fi

        # Build JSON payload and call the Gitea releases API
        PAYLOAD=$(jq -n \
          --arg tag_name "$CI_COMMIT_TAG" \
          --arg name "Release $CI_COMMIT_TAG" \
          --arg body "$NOTES" \
          --argjson prerelease "$IS_PRERELEASE" \
          '{
            tag_name: $tag_name,
            name: $name,
            body: $body,
            draft: false,
            prerelease: $prerelease
          }')

        HTTP_STATUS=$(curl -s -o /tmp/api_response.json -w "%{http_code}" \
          -X POST \
          -H "Authorization: token $$GITEA_TOKEN" \
          -H "Content-Type: application/json" \
          "https://gitea.tgkenney.dev/api/v1/repos/${CI_REPO}/releases" \
          -d "$PAYLOAD")

        if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
          echo "Release created successfully (HTTP $HTTP_STATUS)"
          jq -r '.html_url' /tmp/api_response.json
        else
          echo "ERROR: Failed to create release (HTTP $HTTP_STATUS)"
          cat /tmp/api_response.json
          exit 1
        fi
